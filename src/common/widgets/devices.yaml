sensor:
  # === OVERVIEW THERMOSTATS — températures actuelles et cibles ===

  - platform: homeassistant
    id: pv_ov_current_temp
    entity_id: "climate.thermostat_piece_de_vie"
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: pv_ov_current_label
          text: !lambda 'char b[10]; snprintf(b,10,"%.1f°",x); return b;'

  - platform: homeassistant
    id: pv_ov_target_temp
    entity_id: "climate.thermostat_piece_de_vie"
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: pv_ov_target_label
          text: !lambda 'char b[14]; snprintf(b,14,"cible %.1f°",x); return b;'

  - platform: homeassistant
    id: chambre_ov_current_temp
    entity_id: "climate.thermostat_chambre"
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: chambre_ov_current_label
          text: !lambda 'char b[10]; snprintf(b,10,"%.1f°",x); return b;'

  - platform: homeassistant
    id: chambre_ov_target_temp
    entity_id: "climate.thermostat_chambre"
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: chambre_ov_target_label
          text: !lambda 'char b[14]; snprintf(b,14,"cible %.1f°",x); return b;'

  - platform: homeassistant
    id: felix_ov_current_temp
    entity_id: "climate.thermostat_chambre_felix"
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: felix_ov_current_label
          text: !lambda 'char b[10]; snprintf(b,10,"%.1f°",x); return b;'

  - platform: homeassistant
    id: felix_ov_target_temp
    entity_id: "climate.thermostat_chambre_felix"
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: felix_ov_target_label
          text: !lambda 'char b[14]; snprintf(b,14,"cible %.1f°",x); return b;'


text_sensor:
  # === OVERVIEW THERMOSTATS — modes ===

  - platform: homeassistant
    id: pv_ov_mode
    entity_id: "climate.thermostat_piece_de_vie"
    on_value:
      - if:
          condition:
            lambda: 'return x == "heat";'
          then:
            - lvgl.label.update:
                id: pv_ov_mode_label
                text_color: color_deep_orange
                text: "\U000F0238"
            - lvgl.label.update:
                id: pv_ov_target_label
                text_color: color_deep_orange
          else:
            - lvgl.label.update:
                id: pv_ov_mode_label
                text_color: color_misty_blue
                text: "\U000F0425"
            - lvgl.label.update:
                id: pv_ov_target_label
                text_color: color_steel_blue

  - platform: homeassistant
    id: chambre_ov_mode
    entity_id: "climate.thermostat_chambre"
    on_value:
      - if:
          condition:
            lambda: 'return x == "heat";'
          then:
            - lvgl.label.update:
                id: chambre_ov_mode_label
                text_color: color_deep_orange
                text: "\U000F0238"
            - lvgl.label.update:
                id: chambre_ov_target_label
                text_color: color_deep_orange
          else:
            - lvgl.label.update:
                id: chambre_ov_mode_label
                text_color: color_misty_blue
                text: "\U000F0425"
            - lvgl.label.update:
                id: chambre_ov_target_label
                text_color: color_steel_blue

  - platform: homeassistant
    id: felix_ov_mode
    entity_id: "climate.thermostat_chambre_felix"
    on_value:
      - if:
          condition:
            lambda: 'return x == "heat";'
          then:
            - lvgl.label.update:
                id: felix_ov_mode_label
                text_color: color_deep_orange
                text: "\U000F0238"
            - lvgl.label.update:
                id: felix_ov_target_label
                text_color: color_deep_orange
          else:
            - lvgl.label.update:
                id: felix_ov_mode_label
                text_color: color_misty_blue
                text: "\U000F0425"
            - lvgl.label.update:
                id: felix_ov_target_label
                text_color: color_steel_blue

  # SdB : pas de thermostat, on affiche le radiateur et le boost 1h
  - platform: homeassistant
    id: sdb_ov_mode
    entity_id: "switch.actionneur_sdb"
    on_value:
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.label.update:
                id: sdb_ov_mode_label
                text_color: color_deep_orange
                text: "\U000F0238"
            - lvgl.label.update:
                id: sdb_ov_current_label
                text: "ON"
          else:
            - lvgl.label.update:
                id: sdb_ov_mode_label
                text_color: color_misty_blue
                text: "\U000F0425"
            - lvgl.label.update:
                id: sdb_ov_current_label
                text: "OFF"

  - platform: homeassistant
    id: sdb_ov_boost
    entity_id: "script.salle_de_bain_boost"
    on_value:
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - lvgl.label.update:
                id: sdb_ov_target_label
                text_color: color_deep_orange
                text: "boost en cours"
          else:
            - lvgl.label.update:
                id: sdb_ov_target_label
                text_color: color_steel_blue
                text: "boost 1h"

lvgl:
  pages:
    - id: thermostats_page
      bg_color: color_black
      scrollable: false
      widgets:

        # ─── PIÈCE DE VIE (top-left) ────────────────────────────────────
        - obj:
            id: pv_ov_card
            x: 10
            y: 10
            width: 225
            height: 225
            pad_all: 0
            radius: 20
            bg_color: color_slate_blue_gray
            border_opa: transp
            shadow_opa: transp
            clickable: true
            pressed:
              bg_color: color_steel_blue
            on_press:
              - lvgl.page.show: climate_page
            widgets:
              - label:
                  id: pv_ov_mode_label
                  align: top_left
                  x: 12
                  y: 12
                  text_font: mdi_icons_28
                  text_color: color_deep_orange
                  text: "\U000F0238"
              - label:
                  align: top_left
                  x: 48
                  y: 16
                  text_font: nunito_16
                  text_color: color_misty_blue
                  text: "Pièce de vie"
              - label:
                  id: pv_ov_current_label
                  align: center
                  y: -12
                  text_font: nunito_48
                  text_color: color_misty_blue
                  text: "--°"
              - label:
                  align: center
                  y: 40
                  text_font: nunito_16
                  text_color: color_steel_blue
                  text: "actuel"
              - label:
                  id: pv_ov_target_label
                  align: bottom_mid
                  y: -14
                  text_font: nunito_18
                  text_color: color_deep_orange
                  text: "cible --°"

